<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="logo.png?v=29"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Tracker · Jobs</title><link rel="stylesheet" href="style.css?v=29"></head>
<body><main><div class="page-head"><h1>Jobs</h1><span class="sub" id="sub"></span><span class="spacer"></span><a class="btn" href="calendar.html?v=29">Calendar view</a></div>
<div class="note" style="background:#fff8e1;border:1px solid #f0d58a;color:#7a5600;border-radius:8px;padding:9px 12px;font-weight:700;margin-bottom:12px">Demo: Job #214 (Sample Rig 27) opens the full job screen. Other rows show what the list looks like.</div>
<section class="card"><div class="filters"><label>Terminal<select id="ft"><option value="all">All terminals</option></select></label><label title="Scheduled jobs can't be clocked into. The office marks a job In Progress before anyone can clock in.">Status <span class="muted small">ⓘ</span><select id="fs"><option value="">All statuses</option></select></label><label>Search<input id="fq" placeholder="Job #, rig, customer"></label></div><div id="tab"></div><div class="muted small" style="padding:8px 14px">Statuses: Scheduled → In Progress → Complete. <b>Scheduled</b> jobs can't be clocked into; the office marks a job <b>In Progress</b> before anyone can clock in.</div></section></main>
<script src="app.js?v=29"></script><script>
$('#ft').innerHTML+=Object.entries(TERMS).map(([a,b])=>`<option value="${a}">${b}</option>`).join('');$('#fs').innerHTML+=['Scheduled','In Progress','Complete'].map(s=>`<option>${s}</option>`).join('');
function openJob(id){const dj=JOBS.find(j=>j.job===id&&j.demo);if(dj)return go('job-index.html?v=29&id='+encodeURIComponent(id));if(id==='214')go('job-index.html?v=29');else toast('Demo: only Job #214 opens. Opening Job #214…'),setTimeout(()=>go('job-index.html?v=29'),900)}
function render(){$('#ft').value=S.t;const q=$('#fq').value.toLowerCase(),st=$('#fs').value;
 const J=JOBS.filter(j=>inT(j)&&(!st||j.status===st)&&(!q||(j.job+' '+j.rig+' '+j.cust).toLowerCase().includes(q))).sort((a,b)=>a.job==='214'?-1:b.job==='214'?1:a.date<b.date?1:-1);
 $('#sub').textContent=J.length+' jobs';
 const row=j=>`<tr class="click${j.job==='214'||j.demo?'':' dimrow'}" onclick="openJob('${j.job}')"><td>${j.job==='214'?'<a class="jlink" href="job-index.html?v=29">Job #214</a>':j.demo?`<a class="jlink" href="job-index.html?v=29&id=${j.job}">Job #${j.job}</a> <span class="tag" style="background:#fff3c4;color:#7a5b00" title="Created from won bid ${j.bid}">New from bid</span>`:j.job}</td><td><b>${j.rig}</b></td><td>${j.cust}</td><td>${tchip(j.term)}</td><td>${fd(j.date)}</td><td>${j.days}</td><td>${tag(j.status)}</td><td><a href="bids.html?v=29#quote/${j.bid}" onclick="event.stopPropagation()">${j.bid}</a></td></tr>`;
 const tbl=(id,L,empty)=>`<div class="table-wrap"><table class="grid" id="${id}"><thead><tr><th>Job #</th><th>Rig</th><th>Customer</th><th>Terminal</th><th>Move Date</th><th>Days</th><th>Status</th><th>Bid</th></tr></thead><tbody>${L.map(row).join('')||'<tr><td colspan=8 class=muted>'+empty+'</td></tr>'}</tbody></table></div>`;
 const A=J.filter(j=>j.status!=='Scheduled'),Sc=J.filter(j=>j.status==='Scheduled').sort((a,b)=>a.date<b.date?-1:1);
 $('#tab').innerHTML=`<div style="padding:8px 14px 4px;font-weight:700">In Progress &amp; Complete <span class="muted small">(${A.length})</span></div>`+tbl('jtActive',A,'No In Progress or Complete jobs match.')+`<div id="schedHead" style="margin-top:18px;padding:10px 14px 4px;border-top:2px solid #e2e2e2"><div style="font-size:17px;font-weight:700">Scheduled <span class="muted small">(${Sc.length})</span></div><div class="muted small">Not active. The office must mark these In Progress before anyone can clock in.</div></div>`+tbl('jtSched',Sc,'No Scheduled jobs match.')}
$('#ft').onchange=e=>{S.t=e.target.value;$('#tsel').value=S.t;render()};$('#fs').onchange=render;$('#fq').oninput=render;</script><script>chrome("Jobs");if(typeof render==='function')render()</script></body></html>
