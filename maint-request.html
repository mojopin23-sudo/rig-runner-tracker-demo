<!doctype html><html lang="en"><head><link rel="icon" href="logo.png?v=41"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracker · Maintenance Request</title><link rel="stylesheet" href="style.css?v=41"><style>.mr-ph{display:flex;gap:10px;flex-wrap:wrap}.mr-ph img{width:220px;height:150px;object-fit:cover;border-radius:8px;border:1px solid #ddd;cursor:zoom-in}.mr-h{border-left:3px solid #ddd;padding:4px 0 8px 12px;margin-left:6px}.mr-h b{font-size:13px}.mr-h div{font-size:13px}.mr-err{color:#c20016;font-weight:700;font-size:13px}#lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:999}#lb img{max-width:90vw;max-height:85vh}</style></head>
<body><main id="page"></main><div id="lb" onclick="this.style.display='none'"><img></div><script src="app.js?v=41"></script><script src="mreq.js?v=41"></script><script>
chrome('Reports');
const id=new URLSearchParams(location.search).get('id');
function draw(){const m=MR.get(id),P=$('#page');if(!m){P.innerHTML='<h1>Request not found</h1>';return}
 P.innerHTML=`<div class="crumb"><a href="reports.html?v=41&r=maint">← Maintenance Requests</a></div><h1>${m.id} · ${MR.esc(m.type)} ${MR.tag(m.status)}</h1><div class="sub">${MR.esc(m.unit)} · ${TERMS[m.term]||m.term} · submitted ${fd(m.date)} by ${MR.esc(m.by)}</div>
 <div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start">
 <div><section class="card" style="margin-bottom:16px"><h2>Request</h2><div class="body"><p style="margin-top:0">${MR.esc(m.desc)}</p><table class="t"><tr><th>Unit</th><td>${MR.esc(m.unit)}</td></tr><tr><th>Type</th><td>${MR.esc(m.type)}</td></tr><tr><th>Submitted by</th><td>${MR.esc(m.by)}</td></tr><tr><th>Date</th><td>${fd(m.date)}</td></tr><tr><th>Completed</th><td>${m.done?fd(m.done):'—'}</td></tr></table></div></section>
 <section class="card"><h2>Photos (${m.photos.length})</h2><div class="body">${m.photos.length?'<div class="mr-ph">'+m.photos.map(p=>`<img src="${p}" alt="Request photo">`).join('')+'</div>':'<span class="muted">No photos attached.</span>'}</div></section></div>
 <div><section class="card" style="margin-bottom:16px"><h2>Status</h2><div class="body" style="display:grid;gap:8px"><label style="font-weight:700;font-size:12px">Status<select id="st">${MR.STATUSES.map(s=>`<option${s===m.status?' selected':''}>${s}</option>`).join('')}</select></label>
 <label style="font-weight:700;font-size:12px">Note <span id="nreq" class="muted"></span><textarea id="nt" rows="3" style="width:100%"></textarea></label><div class="mr-err" id="er"></div><button class="btn primary" id="sv">Save status</button></div></section>
 <section class="card"><h2>Status history</h2><div class="body">${m.hist.slice().reverse().map(h=>`<div class="mr-h"><b>${h.from?h.from+' → ':''}${h.to}</b> <span class="muted">· ${h.at} · ${MR.esc(h.by)}</span><div>${MR.esc(h.note)}</div></div>`).join('')}</div></section></div></div>`;
 const hint=()=>{const v=$('#st').value;$('#nreq').textContent=v==='In Progress'?'(required)':v==='Completed'?'(required: work order # or what was done)':'(optional)';$('#nt').placeholder=v==='Completed'?'e.g. WO-5531: replaced brake chambers':v==='In Progress'?'e.g. Parts ordered, unit tagged out':''};
 $('#st').onchange=hint;hint();
 document.querySelectorAll('.mr-ph img').forEach(i=>i.onclick=()=>{$('#lb img').src=i.src;$('#lb').style.display='flex'});
 $('#sv').onclick=()=>{if(readOnly&&readOnly()){toast('Read-only role');return}const e=MR.setStatus(id,$('#st').value,$('#nt').value,'Ray Tolbert');if(e){$('#er').textContent=e;return}toast(id+' → '+$('#st').value);draw()};
}
draw();
</script></body></html>
