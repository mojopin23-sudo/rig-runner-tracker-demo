<!DOCTYPE html><html><head><link rel="icon" href="logo.png?v=15"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=15"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta charset="utf-8"><title>Job (from bid) - Rig Runner Tracker</title><style>:root{--red:#F3011B;--ink:#2A2A27;--red-dark:#c20016;--grey:#6b6b66;--line:#e2e2de;--bg:#f4f4f2;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--red-dark)}
button{font-family:inherit}
/* ---------- top bar ---------- */
.topbar{background:#fff;border-bottom:4px solid var(--red);display:flex;align-items:center;gap:16px;padding:8px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.brand img{height:42px;width:auto;display:block}
.brand .divider{width:1px;height:32px;background:#d6d6d2}
.brand .appname{font-size:22px;font-weight:700;letter-spacing:.5px}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{padding:8px 14px;border-radius:6px;text-decoration:none;color:var(--grey);font-weight:600}
.nav a.active{background:var(--ink);color:#fff}
.nav a.disabled{opacity:.45;cursor:not-allowed}
.topbar .spacer{flex:1}
.demo-badge{background:#fff4d6;color:#7a5600;border:1px solid #f0d58a;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.user{display:flex;align-items:center;gap:8px;color:var(--grey);font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
/* ---------- layout ---------- */
main{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:22px 24px 40px}
footer.appfoot{text-align:center;color:var(--grey);font-size:12px;padding:14px;border-top:1px solid var(--line);background:#fff}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:22px;margin:0}
.page-head .sub{color:var(--grey);font-size:13px}
.page-head .spacer{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #cfcfca;background:#fff;color:var(--ink);padding:8px 14px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#f2f2ef}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-dark)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.btn.won{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.btn.lost{background:#fff;border-color:#b3261e;color:#b3261e}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ---------- filters / table ---------- */
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;border-bottom:1px solid var(--line)}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.4px}
.filters select,.filters input{font-size:14px;padding:7px 10px;border:1px solid #cfcfca;border-radius:6px;min-width:160px;background:#fff;color:var(--ink)}
.filters .count{margin-left:auto;color:var(--grey);font-size:13px;align-self:center}
.table-wrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
table.grid th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--grey);background:#fafaf8;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover{background:#fff6f7}
table.grid td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.grid th.num{text-align:right}
.bidno{font-weight:700;color:var(--ink);white-space:nowrap}
.route{white-space:nowrap}
.route .arrow{color:var(--red);font-weight:700;margin:0 4px}
.info{display:inline-flex;width:15px;height:15px;border-radius:50%;background:#e4e4e0;color:#55554f;font-size:10px;align-items:center;justify-content:center;font-weight:700;cursor:help;margin-left:4px;text-transform:none}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.Draft{background:#ececea;color:#55554f}
.pill.Submitted{background:#e3eefc;color:#1b4f9c}
.pill.Won{background:#e0f4e7;color:#16713d}
.pill.Lost{background:#fde4e2;color:#a3221a}
.joblink{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:#16713d;text-decoration:none;border-bottom:1px dashed #16713d}
.empty{padding:40px;text-align:center;color:var(--grey)}
/* ---------- form ---------- */
.form-card{padding:6px 22px 22px}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--grey);border-bottom:1px solid var(--line);padding:16px 0 8px;margin:0 0 14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.fgrid .full{grid-column:1/-1}
.field label.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.req{color:var(--red);margin-left:2px}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{width:100%;font-size:14px;padding:8px 10px;border:1px solid #cfcfca;border-radius:6px;background:#fff;color:var(--ink);font-family:inherit}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(243,1,27,.25);border-color:var(--red)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:#d0021b;background:#fff7f7}
.err{color:#d0021b;font-size:12px;margin-top:4px;display:none;font-weight:600}
.field.invalid > .err{display:block}
.hint{color:var(--grey);font-size:12px;margin-top:4px}
.sentence{background:#fafaf8;border:1px dashed #d6d6d2;border-radius:6px;padding:9px 12px;font-size:13px;margin-top:8px}
.sentence b{color:var(--red-dark)}
.checks{display:flex;flex-wrap:wrap;gap:8px 22px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--red)}
.equip-list{display:flex;flex-direction:column;gap:6px;max-width:560px}
.equip-row{display:flex;align-items:center;gap:10px;min-height:38px;flex-wrap:wrap}
.equip-row .chk{min-width:130px}
.equip-row .qty{flex:1;min-width:140px;max-width:320px}
.equip-row .qty input{width:100%;font-size:14px;padding:7px 9px;border:1px solid #cfcfca;border-radius:6px}
.equip-row.invalid .qty input{border-color:#d0021b;background:#fff7f7}
.equip-row .err{flex-basis:100%;margin:0 0 0 140px}
.equip-row.invalid .err{display:block}
.radios{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
.money{position:relative}
.money span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--grey);font-weight:700}
.money input{padding-left:24px !important}
.form-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.form-actions .left{margin-right:auto;color:var(--grey);font-size:12px;align-self:center}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.banner.error{background:#fff1f1;border:1px solid #f3b4b4;color:#9b1111}
.banner.ok{background:#e9f7ee;border:1px solid #a9dbbb;color:#155d33}
.banner.note{background:#fff8e1;border:1px solid #f1d27a;color:#6b4d00}
.hidden{display:none !important}
/* ---------- searchable pick list (Rig, Operator) ---------- */
.combo{position:relative}
.combo .combo-input{padding-right:30px}
.combo .caret{position:absolute;right:10px;top:9px;color:var(--grey);font-size:11px;pointer-events:none}
.combo-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #cfcfca;border-radius:7px;box-shadow:0 8px 22px rgba(0,0,0,.14);z-index:30;display:flex;flex-direction:column;overflow:hidden}
.combo-meta{padding:6px 10px;font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.4px;font-weight:700;background:#fafaf8;border-bottom:1px solid var(--line)}
.combo-opts{max-height:252px;overflow-y:auto}
.combo-opt{padding:7px 10px;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo-opt.active{background:#fff0f2}
.combo-opt.sel{font-weight:700}
.combo-opt.sel:after{content:"  \2713";color:var(--red-dark)}
.combo-opt mark{background:none;color:var(--red-dark);font-weight:700}
.combo-none{padding:9px 10px;color:var(--grey);font-style:italic;font-size:13px}
.combo-add{border-top:1px solid var(--line);color:var(--red-dark);font-weight:700;background:#fff}
.combo-add.active{background:#fff0f2}
/* ---------- quote preview ---------- */
.qtoolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:sticky;top:0;z-index:5}
.qtoolbar .spacer{flex:1}
.qtoolbar .meta{font-size:13px;color:var(--grey);display:flex;gap:8px;align-items:center}
.pages{overflow-x:auto;padding-bottom:10px}
.qpage{width:8.5in;height:11in;margin:0 auto 26px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:.42in .55in .5in;position:relative;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#000;font-size:8pt}
.qpage .pgno{position:absolute;bottom:.28in;left:0;right:0;text-align:center;font-size:7pt;color:#777}
.q-logo{width:170px;display:block;margin:6px 0 22px 40px}
.q-bar{background:#000;color:#fff;font-weight:700;padding:4px 5px;font-size:8pt}
table.q{width:100%;border-collapse:collapse}
table.q td{padding:4.5px 5px;border-bottom:1px solid #d9d9d9;vertical-align:top;line-height:1.25}
table.q td.l{width:30%;font-weight:700}
.q-sec{background:#e8e8e8;color:#555;font-weight:700;font-size:7.5pt;font-variant:small-caps;text-transform:uppercase;letter-spacing:.3px;padding:3px 5px;margin-top:14px}
.q-thanks td{border-bottom:none !important}
.q-contact{border-bottom:1px solid #d9d9d9;padding:4px 5px 10px}
.q-contact p{margin:0 0 9px}
.q-contact .gap{height:22px}
.q-rule{border:0;border-top:1px solid #cfcfcf;margin:0 0 8px}
.q-valid{font-size:12.5pt;font-weight:700;margin:4px 0 12px}
.q-terms{font-size:7.8pt;line-height:1.3;margin:6px 0 34px}
.q-signbox{width:3.1in;height:.85in;border:1px solid #e1e1e1;border-radius:3px;position:relative;margin:14px 0 9px}
.q-signbox:after{content:"";position:absolute;left:8px;right:8px;bottom:13px;border-top:2px solid #9a9a9a}
.q-foot{display:flex;justify-content:space-between;align-items:center;padding:18px 50px 0;font-size:8pt}
.q-foot .gen{font-style:italic;color:#9a9a9a}
.q-foot .tr{color:#9a9a9a;font-size:8pt;letter-spacing:.3px}
/* ---------- job view ---------- */
.job-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid var(--line)}
.job-head .check{width:44px;height:44px;border-radius:50%;background:#1f8a4c;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;font-weight:700}
.job-head h2{margin:0;font-size:20px}
.job-head .jobno{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:.5px}
.job-body{padding:18px 22px 22px}
table.map td.src{color:var(--grey);font-size:12.5px;white-space:nowrap}
table.map tbody tr{cursor:default}
table.map tbody tr:hover{background:transparent}
table.map td.f{font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#f1f1ee;border:1px solid #e0e0dc;border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:600}
.callout{border-left:5px solid var(--red);background:#fff4f5;padding:12px 16px;border-radius:6px;margin:0 0 16px;font-weight:700;color:#7d0010;display:flex;gap:10px;align-items:center}
/* ---------- toast ---------- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- responsive ---------- */
@media (max-width:820px){
  .topbar{padding:8px 14px;gap:10px}
  .brand img{height:34px}
  .brand .appname{font-size:19px}
  .nav{margin-left:0}
  main{padding:16px 12px 30px}
  .fgrid{grid-template-columns:1fr}
  .filters select{min-width:130px}
  .filters .count{margin-left:0;flex-basis:100%}
  .user .uname{display:none}
}
/* ---------- print: quote only ---------- */
@page{size:letter;margin:0}
@media print{
  html,body{background:#fff !important}
  body{display:block;min-height:0}
  .topbar,.appfoot,.qtoolbar,.no-print,.toast{display:none !important}
  main{max-width:none;padding:0;margin:0}
  .pages{overflow:visible;padding:0}
  .qpage{margin:0;box-shadow:none;height:10.98in;page-break-after:always;break-after:page}
  .qpage:last-child{page-break-after:auto;break-after:auto}
  .q-bar,.q-sec{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>
(function(){
var esc=function(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var id=new URLSearchParams(location.search).get('id');
var DJ=[];try{DJ=JSON.parse(localStorage.getItem('rrDemoJobs')||'[]');}catch(e){}
var j=DJ.find(function(x){return x.job===id;});
var root=document.getElementById('jd');
if(!j){root.innerHTML='<h1 class="jt">Job not found</h1><p>No demo job'+(id?' #'+esc(id):'')+' exists in this browser. Create one from <a href="bids.html?v=15#list">Bids</a>: open a bid, Mark as Won, and the job appears here.</p>';return;}
var s=j.src||{},T=(window.RR&&RR.TERMS)||{};
var fmt=function(d){if(!d)return '';var p=d.split('-');return p[1]+'/'+p[2]+'/'+p[0];};
function F(lbl,val,type,pf){return '<div class="jd-f'+(pf&&val!==''&&val!=null?' pf':'')+'"><label>'+lbl+(pf&&val!==''&&val!=null?'<span class="pft">from bid</span>':'')+'</label><input type="'+(type||'text')+'" value="'+esc(val)+'"></div>';}
function lines(shift){
  var r=[];var eq=s.equip||{};
  Object.keys(eq).forEach(function(k){var e=eq[k];var on=e&&(e.on||e===true||(e.qty&&e.qty!=='0'));var q=e&&e.qty!=null?e.qty:(typeof e==='string'?e:'');if(on||+q>0)r.push({t:'Equipment',k:k==='Haul Truck'?'Trucks (haul)':k,q:q||'1'});});
  Object.keys(s.pers||{}).forEach(function(k){if(+s.pers[k]>0)r.push({t:'Personnel',k:k,q:s.pers[k]});});
  var hasNight=/night/i.test(s.daysNights||'')||(s.daysNights||'')==='Days & Nights';
  return '<div class="jd-grid">'+F(shift+' Date',j.date,'date',true)+F('Supervisor (Pusher)','', 'text')+F('Shift','Days'===shift?'06:00 - 18:00':'18:00 - 06:00')+'</div>'+
   (shift==='Night'&&!hasNight&&s.daysNights?'<p class="muted small">Bid says <b>'+esc(s.daysNights)+'</b>; night lines are pre-filled for planning and can be cleared.</p>':'')+
   '<table class="jd-tbl"><thead><tr><th>Type</th><th>Resource</th><th>Qty</th><th>Assigned</th></tr></thead><tbody>'+
   (r.length?r.map(function(x){return '<tr class="pf"><td>'+x.t+'</td><td>'+esc(x.k)+' <span class="pft">from bid</span></td><td><input type="number" min="0" value="'+esc(x.q)+'" style="width:70px"></td><td class="muted">Unassigned</td></tr>';}).join(''):'<tr><td colspan=4 class="muted">No resource lines on the bid.</td></tr>')+'</tbody></table>';
}
var term=T[j.term]?j.term+' '+String(T[j.term]).replace(/^\d+\s*/,''):j.term;
var stCls=j.status==='Scheduled'?'Submitted':'Won';
root.innerHTML='<h1 class="jt">Job Details - Job #'+esc(j.job)+' - Rig '+esc(j.rig)+' <span class="pill '+stCls+'" id="status" title="Scheduled jobs can\'t be clocked into. The office marks a job In Progress before anyone can clock in.">'+esc(j.status)+'</span></h1>'+
 '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px"><a class="jd-badge" id="frombid" href="bids.html?v=15#quote/'+esc(j.bid)+'">⇠ Created from Bid #'+esc(j.bid)+'</a>'+
 (j.status==='Scheduled'?'<button class="btn" id="mkip" title="Office only">Mark In Progress (office)</button><span class="muted small">Scheduled jobs can\'t be clocked into. The office marks a job In Progress before anyone can clock in.</span>':'<span class="muted small">In Progress: crews can clock in.</span>')+
 '<span style="flex:1"></span><button class="btn" id="jdreset">↺ Reset demo</button></div>'+
 '<div class="jd-legend"><i></i>Highlighted fields were pre-filled from the bid.</div>'+
 '<div class="jd-tabs" id="tabs">'+['Rig & Job Details','Day Resources','Night Resources','Move In','Move Out'].map(function(t,i){return '<button data-t="'+i+'"'+(i?'':' class="on"')+'>'+t+'</button>';}).join('')+'</div>'+
 '<section class="jd-sec on card" style="padding:0 16px"><div class="jd-grid">'+
   F('Job #',j.job)+F('Customer / Bill To',j.cust,'text',true)+F('Operator',j.oper,'text',true)+F('Rig',j.rig,'text',true)+F('Move Type',j.type,'text',true)+F('Terminal',term,'text',true)+
   F('Old End Lease/Well',s.oldLease,'text',true)+F('Old End Location',j.from,'text',true)+F('Old End Lat',s.oldLat,'text',true)+F('Old End Long',s.oldLng,'text',true)+
   F('New End Lease/Well',s.newLease,'text',true)+F('New End Location',j.to,'text',true)+F('New End Lat',s.newLat,'text',true)+F('New End Long',s.newLng,'text',true)+
   F('Mileage',j.miles,'number',true)+F('Move Start',j.date,'date',true)+F('Move End',j.end,'date',true)+F('Schedule Days',j.days,'number',true)+
   F('Days / Nights',s.daysNights,'text',true)+F('Rig Operations',s.rigOp,'text',true)+F('Bid Price',j.rev?'$'+Number(j.rev).toLocaleString():'','text',true)+F('Sales',s.sales,'text',true)+
 '</div><div class="jd-f'+(s.notes?' pf':'')+'" style="padding-bottom:16px"><label>Notes'+(s.notes?'<span class="pft">from bid</span>':'')+'</label><input type="text" value="'+esc(s.notes)+'"></div></section>'+
 '<section class="jd-sec card" style="padding:0 16px">'+lines('Day')+'</section>'+
 '<section class="jd-sec card" style="padding:0 16px">'+lines('Night')+'</section>'+
 '<section class="jd-sec card" style="padding:0 16px"><div class="jd-grid">'+F('Move In Date',j.end,'date',true)+F('New End Lease/Well',s.newLease,'text',true)+F('New End Lat / Long',(s.newLat||'')+(s.newLat?', ':'')+(s.newLng||''),'text',true)+F('Rig Up Complete','', 'date')+'</div></section>'+
 '<section class="jd-sec card" style="padding:0 16px"><div class="jd-grid">'+F('Move Out Date',j.date,'date',true)+F('Old End Lease/Well',s.oldLease,'text',true)+F('Old End Lat / Long',(s.oldLat||'')+(s.oldLat?', ':'')+(s.oldLng||''),'text',true)+F('Rig Down Complete','', 'date')+'</div></section>';
var tb=document.querySelectorAll('#tabs button'),sc=document.querySelectorAll('.jd-sec');
tb.forEach(function(b){b.onclick=function(){tb.forEach(function(x){x.classList.remove('on');});sc.forEach(function(x){x.classList.remove('on');});b.classList.add('on');sc[+b.dataset.t].classList.add('on');};});
var mk=document.getElementById('mkip');if(mk)mk.onclick=function(){j.status='In Progress';localStorage.setItem('rrDemoJobs',JSON.stringify(DJ));location.reload();};
document.getElementById('jdreset').onclick=function(){if(!confirm('Reset demo? This removes bids and jobs created in this demo.'))return;['rrDemoBids','rrBidStatus','rrDemoJobs'].forEach(function(k){localStorage.removeItem(k);});location.href='bids.html?v=15#list';};
})();
</script><script>rrChrome("Jobs")</script></body></html>
