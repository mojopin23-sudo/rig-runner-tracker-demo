const ADMINF=['Status','Legacy Codes','Category','Billing Method','Billing Portal','Billing Contact','Billing Contact Title','Billing Email','Summary Invoice Email','Notes'];

['customers','Customers','Bill-to customers (no price sheets). Only Customer Name is required. Sample data only.',['Customer Name','Status','Category','Billing Method','Billing Portal','City','State','Zip','Main Phone','Billing Contact','Billing Email','Vendor / Supplier #','Summary Invoice Email'],[['Sample Drilling Co.','Active','MSA','Regular','—','Pleasanton','TX','78064','(555) 010-2001','Accounts Payable','ap@sampledrilling.example','—','—'],['Demo Energy LLC','Active','GS','Regular + Summary','Sample e-invoice portal','Midland','TX','79701','(555) 010-2002','Pat Example','billing@demoenergy.example','V-100245','summary@demoenergy.example'],['Example Resources Inc','Active','GS','Summary','—','Longview','TX','75601','(555) 010-2003','Accounts Payable','ap@exampleresources.example','—','—'],['Placeholder Pipeline LP','Inactive','BCA','Regular','—','Alice','TX','78332','—','Sam Sample','invoices@placeholder.example','SUP-7781','—']]],
['operators','Operators','Operating companies tied to rigs and bids. Only Operator Name is required. Sample data only.',['Operator Name','Status','Matched Customer (Bill-To)','Match Confidence','City','State'],[['Sample Operating Co.','Active','Sample Drilling Co.','Exact','Pleasanton','TX'],['Demo Petroleum','Active','Demo Energy LLC','Name starts the same','Midland','TX'],['Example Exploration','Active','—','No match (no bill-to link)','—','—']]],
['daily-log','Manage Daily Log','Employees by day of the week; job days prefill from assignments; per diem from approved time tickets.',['Date','Employee','Job','Time Ticket','Per Diem'],[['Nov 2, 2026','Sample Driver A','#214','Approved','Accrued'],['Nov 2, 2026','Sample Swamper B','#214','Pending','Not yet (ticket pending)'],['Nov 1, 2026','Sample Operator C','#211','Rejected','None']]],
['rigs','Rigs','Rig list. Only Rig Name is required; contractor and rig # come from the name. The operator is set on each job/bid, not on the rig. Sample data only.',['Rig Name','Drilling Contractor','Rig Number','Status','Contractor Customer (Bill-To)','Match Confidence'],[['Sample Drilling #27','Sample Drilling','27','Active','Sample Drilling Co.','Exact'],['Sample Drilling #41','Sample Drilling','41','Active','Sample Drilling Co.','Exact'],['Demo Rigs #X05','Demo Rigs','X05','Active','—','No match (unlinked)']]],
['exception-triggers','Exception Triggers','Rules that flag time records and jobs for the Exception Queue. Sample data only.',[],[]],
['status-settings','Status Settings','Job, bid and resource statuses and their colors.',['Status','Used for','Color'],[['Scheduled','Jobs','Blue'],['In Progress','Jobs','Green'],['Won','Bids','Green']]],
['system-configuration','System Configuration','Company-wide settings: terminals, defaults and notifications.',['Setting','Value'],[['Terminals','308 Alice, 331 Jourdanton, 335 Odessa, 346 Kilgore'],['Default shift length','12 hours'],['Text notifications','Enabled (demo)']]]];
function render(){const k=location.hash.slice(1),x=AD.find(d=>d[0]==k);
 if(k=='daily-log'){location.replace('daily-log.html?v=32');return}
 if(x&&(k=='status-settings'||k=='system-configuration')){$('#sub').textContent='Admin · '+x[1];$('#a').innerHTML=`<a href="#" style="font-weight:700">← All Admin sections</a><section class="card" style="margin-top:10px;text-align:center;padding:40px"><h2 style="margin:0 0 8px">${x[1]}</h2><div style="font-size:20px;font-weight:700">🚧 Coming soon</div><div class="muted" style="margin-top:8px">To be defined with Kaeppel.</div></section>`;return}
 if(x&&k=='exception-triggers'){$('#sub').textContent='Admin · Exception Triggers';$('#a').innerHTML=xtPage();xtWire();return}
 if(!x){$('#sub').textContent=AD.length+' sections · demo placeholders';$('#a').innerHTML='<div class="wgrid">'+AD.map(d=>`<a class="card" href="${d[0]=='daily-log'?'daily-log.html?v=32':'#'+d[0]}" style="display:block;text-decoration:none;color:inherit"><h3 style="margin:0 0 6px">${d[1]}</h3><div class="muted">${d[2]}</div><div style="margin-top:10px"><span class="pill off">Demo placeholder</span></div></a>`).join('')+'</div><div class="muted" style="margin-top:12px">Resources is its own top-level tab.</div>';return}
 $('#sub').textContent='Admin · '+x[1];$('#a').innerHTML=`<a href="#" style="font-weight:700">← All Admin sections</a><section class="card" style="margin-top:10px"><h2 style="margin:0 0 6px">${x[1]}</h2><div class="muted" style="margin-bottom:10px">${x[2]}</div>${x[0]=='customers'?'<div style="margin-bottom:8px"><span class="btn primary" onclick="toast(\'Add customer (demo)\')">+ Add Customer</span> <span class="btn" onclick="toast(\'Import from spreadsheet (demo)\')">Import</span> <span class="muted">🔒 Admin = visible to Admin and above only. Also stored: Address 1/2 and Website (all roles); 🔒 Legacy Codes, Billing Contact Title, Notes. Customers are not tied to terminals.</span></div>':''}<div class="table-wrap">${table(x[0]=='customers'?x[3].map(c=>ADMINF.includes(c)?c+' <span class="pill warn" title="Admin and above only">🔒 Admin</span>':c):x[3],x[4])}</div>${['customers','operators','rigs'].includes(x[0])?'<div class="muted" style="margin-top:8px">🔒 Access: Dispatch and above only. Roles below Dispatch can\'t open this list; they see customer / rig / operator info only on their jobs.</div>':''}<div class="muted" style="margin-top:8px">Sample data · placeholder page for the demo.</div></section>`}
const XT=[['shift','Shift over 16 hours','Time records','hours',16,''],['loc','Clock-in away from job location','Time records','miles from job site',1,'Drivers flagged "Ignore clock-in-away-from-location exception" on their Personnel record are skipped.'],['mco','Missed clock-out','Time records','hours after shift end',2,''],['insp','Operator clocked into a job with no inspection submitted','Jobs / Inspections','hours clocked in',1,''],['wb','Driver clocked out without submitting a waybill','Waybills','',null,''],['eqc','Operator clocked into a job without clocking into equipment','Time records / Equipment','minutes grace (placeholder)',15,'Applies to people assigned to the job as Crane Operator, Tandem Operator, Pole Truck Operator or Forklift Operator. Optional grace period; 15 min default is a placeholder.']];
let XS=JSON.parse(localStorage.rrXT||'{}');
function xtPage(){return `<a href="#" style="font-weight:700">← All Admin sections</a><section class="card" style="margin-top:10px"><h2 style="margin:0 0 6px">Exception Triggers</h2><div class="muted" style="margin-bottom:10px">Each rule can be turned on or off; thresholds are editable. Flagged items go to the Exception Queue. No per diem trigger.</div>${table(['On','Trigger','Applies to','Threshold','Notes'],XT.map(t=>{const s=XS[t[0]]||{on:true,v:t[4]};return [`<label class="xtsw"><input type="checkbox" data-x="${t[0]}" ${s.on?'checked':''}> <b>${s.on?'On':'Off'}</b></label>`,`<b>${t[1]}</b>`,t[2],t[4]==null?'<span class="muted">—</span>':`${t[0]=='shift'?'Over':t[0]=='insp'?'More than':t[0]=='loc'?'More than':t[0]=='eqc'?'After':'After'} <input type="number" min="0" step="${t[0]=='loc'?'0.5':'1'}" data-xv="${t[0]}" value="${s.v}" style="width:64px"> ${t[3]}`,t[5]?'<div style="white-space:normal;max-width:300px">'+t[5]+'</div>':'<span class="muted">—</span>']}))}</section>
<section class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">Exception Queue preview <span class="muted" style="font-weight:400">(sample)</span></h3>${table(['Flagged','Employee','Job','Trigger','Detail'],[['Nov 2, 2026 6:40 PM','Callister, Wade','#214 · Sample Rig 27','Shift over 16 hours','16.5 hrs clocked'],['Nov 3, 2026 5:12 AM','Pham, Andre','#219 · Demo Rig X05','Clock-in away from job location','Clocked in 4.2 mi from job site'],['Nov 3, 2026 9:30 AM','Hollins, Marcus','#214 · Sample Rig 27','Operator clocked into a job with no inspection submitted','1 hr 25 min clocked in, no inspection'],['Nov 3, 2026 6:20 AM','Riggs, Owen','#219 · Demo Rig X05','Operator clocked into a job without clocking into equipment','Assigned as Forklift Operator; clocked into job 6:00 AM, no equipment after 15 min grace']])}<div class="muted" style="margin-top:6px">Gallegos, Mario (Company Driver) is set to ignore the location exception, so his off-site clock-ins are not flagged.</div></section>`}
function xtWire(){$('#a').querySelectorAll('[data-x]').forEach(c=>c.onchange=()=>{const k=c.dataset.x;XS[k]=XS[k]||{on:true,v:XT.find(t=>t[0]==k)[4]};XS[k].on=c.checked;localStorage.rrXT=JSON.stringify(XS);render();toast('Saved (demo)')});$('#a').querySelectorAll('[data-xv]').forEach(i=>i.onchange=()=>{const k=i.dataset.xv;XS[k]=XS[k]||{on:true};XS[k].v=+i.value;localStorage.rrXT=JSON.stringify(XS);toast('Threshold saved (demo)')})}
addEventListener('hashchange',render);</script>
<script>chrome("Admin");if(typeof render==='function')render()</script></body></html>
