<!doctype html><html><head><meta charset="utf-8"><title>Record PDF · Tracker demo</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:Arial,Helvetica,sans-serif;background:#eee;margin:0}.bar{background:#222;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:14px}.bar a{color:#fff}.bar .sp{flex:1}.bar button{background:#c8102e;color:#fff;border:0;padding:6px 12px;border-radius:4px;cursor:pointer}.demo{background:#fff3c4;color:#5a4500;padding:2px 8px;border-radius:10px;font-size:12px}
.pg{background:#fff;max-width:800px;margin:18px auto;padding:34px 42px;box-shadow:0 2px 10px #0002}.hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #c8102e;padding-bottom:10px}.hd img{height:56px}h1{margin:0;font-size:22px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:4px 10px;font-size:14px;margin:16px 0}.kv b{text-align:right}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th,td{border:1px solid #ccc;padding:5px;text-align:left}th{background:#f3f3f3}.ok{color:#17803d;font-weight:700}.bad{color:#c8102e;font-weight:700}.sig{margin-top:26px;font-size:13px}
@media print{.bar{display:none}body{background:#fff}.pg{box-shadow:none;margin:0}}</style></head><body>
<div class="bar"><a href="javascript:history.back()">← Back</a><span class="demo">Demo mockup · sample data</span><span class="sp"></span><button onclick="print()">Print / Save PDF</button></div><div class="pg" id="p"></div>
<script>
const q=Object.fromEntries(new URLSearchParams(location.search));const k=q.kind=='JSA'?'JSA':'Inspection';const e=s=>String(s||'—').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const title=k=='JSA'?'Equipment Job Safety Analysis (JSA)':'Equipment Inspection Report';
const items=k=='JSA'?[['Rigging up / setting outriggers','Pinch points, unstable ground','Mats under outriggers, spotter, gloves'],['Lifting loads','Dropped load, swing radius','Tag lines, barricade swing area, inspect rigging'],['Travel on lease road','Rollover, overhead lines','Spotter, 20 ft clearance from lines'],['Rig down','Slips and trips','Three points of contact, clear walkways']]
:[['Brakes','Satisfactory'],['Lights and reflectors','Satisfactory'],['Tires and wheels','Satisfactory'],['Hydraulics / hoses','Satisfactory'],['Wire rope / rigging','Satisfactory'],['Fire extinguisher','Satisfactory'],['Load chart / placards','Satisfactory'],['Overall condition','Satisfactory']];
document.getElementById('p').innerHTML=`<div class="hd"><img src="logo.png?v=39" alt="Rig Runner"><div style="text-align:right"><h1>${title}</h1><div style="font-size:13px">${k=='JSA'?'JSA':'Inspection'} #${e(q.num||'—')}</div></div></div>
<div class="kv"><b>Job #:</b><span>${e(q.job)}</span><b>Date:</b><span>${e(q.date)}</span><b>Equipment:</b><span>${e(q.eq)} · ${e(q.type)}</span><b>${k=='JSA'?'Prepared by':'Inspected by'}:</b><span>${e(q.by||'Sample Employee')}</span><b>Source file:</b><span>${e(q.file)}</span></div>
<table><thead>${k=='JSA'?'<tr><th>Job step</th><th>Hazards</th><th>Controls</th></tr>':'<tr><th>Item</th><th>Result</th></tr>'}</thead><tbody>${items.map(r=>'<tr>'+r.map((c,i)=>`<td class="${k!='JSA'&&i==1?'ok':''}">${c}</td>`).join('')+'</tr>').join('')}</tbody></table>
<div class="sig">Signature: ______________________ &nbsp; Reviewed by: ______________________</div><div style="font-size:11px;color:#777;margin-top:20px">Generated by Tracker (demo). All names and figures are fictional.</div>`;
</script></body></html>
